<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><rect width="1280" height="640" fill="#0d1117"/><style>.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .cover { display: none; }</style><text x="64" y="96" class="sans" font-size="56" fill="#e6edf3" font-weight="700" text-anchor="start">xprobe</text><text x="64" y="140" class="sans" font-size="26" fill="#8d96a0" font-weight="400" text-anchor="start">Why is my CPU, Python, or CUDA process slow? Two commands.</text><g transform="translate(232 168) scale(0.86)"><title id="title">xprobe: triage a slow process, then measure the exact latency</title><desc id="desc">A terminal runs xprobe triage on a PyTorch CUDA process. Ranked findings show a CPU hotspot, a dominant GPU kernel, and power-capped GPU clocks. A second command measures request to launch 1.14 ms, launch to kernel 99 microseconds, and kernel duration 1.2 microseconds on CPU and GPU timelines.</desc><style>.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .cover { display: none; }</style><rect width="960" height="540" rx="14" opacity="0" fill="#0d1117"/><rect x="20" y="20" width="920" height="500" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="44" cy="42" r="5" fill="#ff5f57"/><circle cx="62" cy="42" r="5" fill="#febc2e"/><circle cx="80" cy="42" r="5" fill="#28c840"/><text x="480.0" y="47" class="sans" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="middle">Why is PID 4242 slow?</text><g class="scene"><g><text x="48" y="90" class="mono" font-size="15" fill="#4493f8" font-weight="700" text-anchor="start">$</text><text x="66" y="90" class="mono" font-size="15" fill="#e6edf3" font-weight="400" text-anchor="start">xprobe measure --pid 4242 --triage --duration-ms 2000</text><rect class="anim cover cmd1" x="64" y="74" width="467" height="22" fill="#161b22"/></g><g class="anim find1"><text x="48" y="130" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">1</text><text x="70" y="130" class="mono" font-size="14" fill="#ab7df8" font-weight="700" text-anchor="start">CPU_HOTSPOT</text><text x="70" y="149" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">libgomp worker spinning: 77% of sampled stacks</text><rect x="600" y="118" width="260" height="12" rx="6" fill="#21262d"/><rect class="anim bar-find1" x="600" y="118" width="198" height="12" rx="6" fill="#ab7df8"/><text x="874" y="130" class="mono" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="start">76%</text></g><g class="anim find2"><text x="48" y="174" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">2</text><text x="70" y="174" class="mono" font-size="14" fill="#3fb950" font-weight="700" text-anchor="start">GPU_KERNEL_DOMINANT</text><text x="70" y="193" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">ampere_sgemm_128x64_nn: all kernel time, GPU busy 54%</text><rect x="600" y="162" width="260" height="12" rx="6" fill="#21262d"/><rect class="anim bar-find2" x="600" y="162" width="140" height="12" rx="6" fill="#3fb950"/><text x="874" y="174" class="mono" font-size="13" fill="#e6edf3" font-weight="700" text-anchor="start">54%</text></g><g class="anim find3"><text x="48" y="218" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">3</text><text x="70" y="218" class="mono" font-size="14" fill="#d29922" font-weight="700" text-anchor="start">GPU_CLOCK_LIMITED</text><text x="70" y="237" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">sw_power_cap under load</text><rect x="600" y="206" width="260" height="12" rx="6" fill="#21262d"/><text x="874" y="218" class="mono" font-size="13" fill="#8d96a0" font-weight="400" text-anchor="start">n/a</text></g><g class="anim next"><text x="48" y="262" class="mono" font-size="13" fill="#4493f8" font-weight="400" text-anchor="start">→ each finding ships a ready next spec</text></g><g><text x="48" y="304" class="mono" font-size="15" fill="#4493f8" font-weight="700" text-anchor="start">$</text><text x="66" y="304" class="mono" font-size="15" fill="#e6edf3" font-weight="400" text-anchor="start">xprobe measure --spec next.json</text><rect class="anim cover cmd2" x="64" y="288" width="282" height="22" fill="#161b22"/></g><g class="anim lanes"><text x="48" y="367" class="mono" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="start">CPU</text><text x="48" y="445" class="mono" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">GPU</text><line x1="150" y1="362" x2="900" y2="362" stroke="#30363d" stroke-width="2"/><line x1="150" y1="440" x2="900" y2="440" stroke="#30363d" stroke-width="2"/><circle cx="190" cy="362" r="6" fill="#ab7df8"/><text x="190" y="348" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">request</text><circle cx="560" cy="362" r="6" fill="#ab7df8"/><text x="560" y="348" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">cudaLaunchKernel returns</text><rect x="690" y="431" width="70" height="18" rx="4" fill="#3fb950"/><text x="725.0" y="468" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">kernel</text></g><g class="anim edge1"><path d="M198 364 L552 364" stroke="#ab7df8" stroke-width="3"/><text x="375.0" y="384" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">request → launch  1.14 ms  (first-after)</text></g><g class="anim edge2"><path d="M560 369 C560 420, 690 382, 690 430" fill="none" stroke="#4493f8" stroke-width="3" stroke-dasharray="6 5"/><text x="550" y="409.0" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="end">launch → kernel  99 µs  (exact)</text></g><g class="anim edge3"><text x="772" y="445" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">kernel  1.2 µs  (exact)</text></g><g class="anim tagline"><text x="480.0" y="494" class="sans" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">Two commands. Bounded capture. No daemon. Evidence an agent can read.</text></g></g></g></svg>
