<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><rect width="1280" height="640" fill="#0d1117"/><style>.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .cover { display: none; }</style><text x="64" y="96" class="sans" font-size="56" fill="#e6edf3" font-weight="700" text-anchor="start">xprobe</text><text x="64" y="140" class="sans" font-size="26" fill="#8d96a0" font-weight="400" text-anchor="start">Bounded latency evidence from CPU, Python, and CUDA processes.</text><g transform="translate(232 168) scale(0.86)"><title id="title">xprobe: measure a request's latency path from one capture</title><desc id="desc">A terminal runs one xprobe measurement graph on a CUDA process. It reports request to launch 1.14 ms, launch to kernel 99 microseconds, and kernel duration 1.2 microseconds, shown on CPU and GPU timelines; the raw events are kept for offline analysis.</desc><style>.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; } .cover { display: none; }</style><rect width="960" height="540" rx="14" opacity="0" fill="#0d1117"/><rect x="20" y="20" width="920" height="500" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="44" cy="42" r="5" fill="#ff5f57"/><circle cx="62" cy="42" r="5" fill="#febc2e"/><circle cx="80" cy="42" r="5" fill="#28c840"/><text x="480.0" y="47" class="sans" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="middle">Where does a request&#x27;s time go in PID 4242?</text><g class="scene"><g><text x="48" y="90" class="mono" font-size="15" fill="#4493f8" font-weight="700" text-anchor="start">$</text><text x="66" y="90" class="mono" font-size="15" fill="#e6edf3" font-weight="400" text-anchor="start">xprobe measure --pid 4242 --spec request-graph.json</text><rect class="anim cover cmd1" x="64" y="74" width="450" height="22" fill="#161b22"/></g><g class="anim find1"><text x="48" y="130" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">1</text><text x="70" y="130" class="mono" font-size="14" fill="#ab7df8" font-weight="700" text-anchor="start">request_to_launch</text><text x="70" y="149" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">first-after · request → cudaLaunchKernel returns</text><text x="880" y="130" class="mono" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="end">1.14 ms</text></g><g class="anim find2"><text x="48" y="174" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">2</text><text x="70" y="174" class="mono" font-size="14" fill="#4493f8" font-weight="700" text-anchor="start">launch_to_kernel</text><text x="70" y="193" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">exact · same CUPTI correlation ID</text><text x="880" y="174" class="mono" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="end">99 µs</text></g><g class="anim find3"><text x="48" y="218" class="mono" font-size="14" fill="#8d96a0" font-weight="400" text-anchor="start">3</text><text x="70" y="218" class="mono" font-size="14" fill="#3fb950" font-weight="700" text-anchor="start">kernel</text><text x="70" y="237" class="mono" font-size="12.5" fill="#8d96a0" font-weight="400" text-anchor="start">exact · kernel start → end</text><text x="880" y="218" class="mono" font-size="14" fill="#e6edf3" font-weight="700" text-anchor="end">1.2 µs</text></g><g class="anim next"><text x="48" y="262" class="mono" font-size="13" fill="#4493f8" font-weight="400" text-anchor="start">→ every raw event is kept for your agent to analyze offline</text></g><g><text x="48" y="304" class="mono" font-size="15" fill="#4493f8" font-weight="700" text-anchor="start">$</text><text x="66" y="304" class="mono" font-size="15" fill="#e6edf3" font-weight="400" text-anchor="start">scripts/analyze_trace.py events.jsonl</text><rect class="anim cover cmd2" x="64" y="288" width="333" height="22" fill="#161b22"/></g><g class="anim lanes"><text x="48" y="367" class="mono" font-size="13" fill="#ab7df8" font-weight="700" text-anchor="start">CPU</text><text x="48" y="445" class="mono" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">GPU</text><line x1="150" y1="362" x2="900" y2="362" stroke="#30363d" stroke-width="2"/><line x1="150" y1="440" x2="900" y2="440" stroke="#30363d" stroke-width="2"/><circle cx="190" cy="362" r="6" fill="#ab7df8"/><text x="190" y="348" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">request</text><circle cx="560" cy="362" r="6" fill="#ab7df8"/><text x="560" y="348" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">cudaLaunchKernel returns</text><rect x="690" y="431" width="70" height="18" rx="4" fill="#3fb950"/><text x="725.0" y="468" class="mono" font-size="12" fill="#8d96a0" font-weight="400" text-anchor="middle">kernel</text></g><g class="anim edge1"><path d="M198 364 L552 364" stroke="#ab7df8" stroke-width="3"/><text x="375.0" y="384" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="middle">request → launch  1.14 ms  (first-after)</text></g><g class="anim edge2"><path d="M560 369 C560 420, 690 382, 690 430" fill="none" stroke="#4493f8" stroke-width="3" stroke-dasharray="6 5"/><text x="550" y="409.0" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="end">launch → kernel  99 µs  (exact)</text></g><g class="anim edge3"><text x="772" y="445" class="mono" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">kernel  1.2 µs  (exact)</text></g><g class="anim tagline"><text x="480.0" y="494" class="sans" font-size="15" fill="#e6edf3" font-weight="600" text-anchor="middle">Bounded capture. Strict JSON. No daemon. Evidence your agent can analyze.</text></g></g></g></svg>
